", "bad": false, "state": {"readers": ["Waiting", "Idle", "Idle", "Waiting"], "writers": ["Idle", "Writing"], "value": 1, "readcount": 1}}, {"t": 2.144, "actor": "W1", "msg": "wrote value 1 -> 2", "bad": false, "state": {"readers": ["Waiting", "Idle", "Idle", "Waiting"], "writers": ["Idle", "Writing"], "value": 2, "readcount": 1}}, {"t": 2.145, "actor": "W1", "msg": "EXITS CS: V(wrt)", "bad": false, "state": {"readers": ["Waiting", "Idle", "Idle", "Waiting"], "writers": ["Idle", "Idle"], "value": 2, "readcount": 1}}, {"t": 2.145, "actor": "R0", "msg": "ENTERS CS, reads value=2", "bad": false, "state": {"readers": ["Reading", "Idle", "Idle", "Waiting"], "writers": ["Idle", "Idle"], "value": 2, "readcount": 1}}, {"t": 2.146, "actor": "R3", "msg": "ENTERS CS, reads value=2", "bad": false, "state": {"readers": ["Reading", "Idle", "Idle", "Reading"], "writers": ["Idle", "Idle"], "value": 2, "readcount": 2}}, {"t": 2.19, "actor": "W0", "msg": "wants to write: P(wrt)", "bad": false, "state": {"readers": ["Reading", "Idle", "Idle", "Reading"], "writers": ["Waiting", "Idle"], "value": 2, "readcount": 2}}, {"t": 2.26, "actor": "W1", "msg": "wants to write: P(wrt)", "bad": false, "state": {"readers": ["Reading", "Idle", "Idle", "Reading"], "writers": ["Waiting", "Waiting"], "value": 2, "readcount": 2}}, {"t": 2.35, "actor": "R0", "msg": "EXITS CS", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Reading"], "writers": ["Waiting", "Waiting"], "value": 2, "readcount": 1}}, {"t": 2.449, "actor": "R3", "msg": "EXITS CS", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Waiting", "Waiting"], "value": 2, "readcount": 0}}, {"t": 2.45, "actor": "R3", "msg": "last reader: V(wrt) lets writers in", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Waiting", "Waiting"], "value": 2, "readcount": 0}}, {"t": 2.45, "actor": "W0", "msg": "ENTERS CS (exclusive)", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Writing", "Waiting"], "value": 2, "readcount": 0}}, {"t": 2.945, "actor": "W0", "msg": "wrote value 2 -> 3", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Writing", "Waiting"], "value": 3, "readcount": 0}}, {"t": 2.946, "actor": "W0", "msg": "EXITS CS: V(wrt)", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Idle", "Waiting"], "value": 3, "readcount": 0}}, {"t": 2.946, "actor": "W1", "msg": "ENTERS CS (exclusive)", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Idle", "Writing"], "value": 3, "readcount": 0}}, {"t": 3.214, "actor": "W0", "msg": "wants to write: P(wrt)", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Waiting", "Writing"], "value": 3, "readcount": 0}}, {"t": 3.219, "actor": "W1", "msg": "wrote value 3 -> 4", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Waiting", "Writing"], "value": 4, "readcount": 0}}, {"t": 3.219, "actor": "W1", "msg": "EXITS CS: V(wrt)", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Waiting", "Idle"], "value": 4, "readcount": 0}}, {"t": 3.22, "actor": "W0", "msg": "ENTERS CS (exclusive)", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Writing", "Idle"], "value": 4, "readcount": 0}}, {"t": 3.4, "actor": "W1", "msg": "wants to write: P(wrt)", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Writing", "Waiting"], "value": 4, "readcount": 0}}, {"t": 3.589, "actor": "W0", "msg": "wrote value 4 -> 5", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Writing", "Waiting"], "value": 5, "readcount": 0}}, {"t": 3.589, "actor": "W0", "msg": "EXITS CS: V(wrt)", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Idle", "Waiting"], "value": 5, "readcount": 0}}, {"t": 3.59, "actor": "W1", "msg": "ENTERS CS (exclusive)", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Idle", "Writing"], "value": 5, "readcount": 0}}, {"t": 3.979, "actor": "W1", "msg": "wrote value 5 -> 6", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Idle", "Writing"], "value": 6, "readcount": 0}}, {"t": 3.979, "actor": "W1", "msg": "EXITS CS: V(wrt)", "bad": false, "state": {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Idle", "Idle"], "value": 6, "readcount": 0}}], INITIAL = {"readers": ["Idle", "Idle", "Idle", "Idle"], "writers": ["Idle", "Idle"], "value": 0, "readcount": 0};
let idx=-1, timer=null, playing=false;
const $ = id => document.getElementById(id);

const COL={Idle:'#9aa5b1',Waiting:'#f2b134',Reading:'#22a05a',Writing:'#d6455d'};
let RC=[],WC=[];
function setup(){
  const nr=INITIAL.readers.length, nw=INITIAL.writers.length;
  $('board').innerHTML='<div class="col"><h3>Readers</h3><div class="cards" id="rd"></div></div>'
   +'<div class="col"><h3>Shared resource (critical section)</h3><div id="res"></div></div>'
   +'<div class="col"><h3>Writers</h3><div class="cards" id="wr"></div></div><p id="sem" style="font:12px ui-monospace,monospace"></p>';
  for(let i=0;i<nr;i++){const d=document.createElement('div');d.className='card';$('rd').appendChild(d);RC.push(d);}
  for(let i=0;i<nw;i++){const d=document.createElement('div');d.className='card';$('wr').appendChild(d);WC.push(d);}
  $('legend').innerHTML=Object.entries(COL).map(([k,v])=>`<span><i style="background:${v}"></i>${k}</span>`).join('');
}
function render(s,e){
  s.readers.forEach((st,i)=>{RC[i].style.background=COL[st];RC[i].innerHTML='<b>R'+i+'</b>'+st;});
  s.writers.forEach((st,i)=>{WC[i].style.background=COL[st];WC[i].innerHTML='<b>W'+i+'</b>'+st;});
  const nW=s.writers.filter(x=>x=='Writing').length, nR=s.readers.filter(x=>x=='Reading').length;
  const waitR=s.readers.filter(x=>x=='Waiting').length, waitW=s.writers.filter(x=>x=='Waiting').length;
  const r=$('res'); r.style.background=nW?'#fde2e7':nR?'#dcf5e6':'#fff'; r.style.borderColor=nW?'#d6455d':nR?'#22a05a':'#444';
  r.innerHTML='value = <b>'+s.value+'</b><br>'+(nW?'being WRITTEN (exclusive)':nR?'being READ by '+nR+' reader(s) (shared)':'free');
  $('sem').textContent='read_count='+s.readcount+'   wrt='+((nW||nR)?0:1)+(nW?' (held by writer)':nR?' (held by readers)':'')
    +'   waiting: '+waitR+' reader(s), '+waitW+' writer(s)'+(e&&e.bad?'   !! VIOLATION':'');
}

function show(k){
  idx=k; const e=EV[k]; render(e.state,e);
  $('slider').value=k; $('pos').textContent=(k+1)+'/'+EV.length; $('time').textContent=e.t.toFixed(2)+'s';
  document.querySelectorAll('.row.active').forEach(r=>r.classList.remove('active'));
  const r=$('r'+k); r.classList.add('active'); r.scrollIntoView({block:'nearest'});
}
function resetAll(){ stop(); idx=-1; render(INITIAL,null); $('slider').value=0; $('pos').textContent='0/'+EV.length; $('time').textContent='';
  document.querySelectorAll('.row.active').forEach(r=>r.classList.remove('active')); }
function stop(){ playing=false; clearTimeout(timer); $('play').innerHTML='&#9654; Start'; }
function tick(){
  if(idx>=EV.length-1){ stop(); return; }
  show(idx+1);
  if(idx<EV.length-1){ const dt=(EV[idx+1].t-EV[idx].t)*1000/parseFloat($('speed').value);
    timer=setTimeout(tick, Math.min(Math.max(dt,40),1500)); } else stop();
}
$('play').onclick=()=>{ if(playing){stop();return;} if(idx>=EV.length-1) resetAll();
  playing=true; $('play').innerHTML='&#10074;&#10074; Pause'; tick(); };
$('step').onclick=()=>{ stop(); if(idx<EV.length-1) show(idx+1); };
$('reset').onclick=resetAll;
$('slider').max=EV.length-1; $('slider').oninput=e=>{ stop(); show(parseInt(e.target.value)); };
EV.forEach((e,k)=>{ const d=document.createElement('div'); d.className='row'+(e.bad?' bad':''); d.id='r'+k;
  d.textContent=e.t.toFixed(2).padStart(6)+'s  '+e.actor.padEnd(4)+' '+e.msg; d.onclick=()=>{stop();show(k);}; $('log').appendChild(d); });
setup(); resetAll();
</script></body></html>
